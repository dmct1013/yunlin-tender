name: 更新採購資料

on:
  schedule:
    - cron: '30 0 * * *'  # 每天台北時間 08:30（UTC 00:30）
  workflow_dispatch:      # 允許手動觸發

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: 執行爬蟲
        run: python pcc_crawler.py

      - name: 驗證資料完整性
        run: |
          python - <<'PY'
          import json

          with open("data.json", encoding="utf-8") as file:
              data = json.load(file)

          total = int(data.get("total") or 0)
          failed = list(data.get("failed_orgs") or [])
          org_count = int(data.get("org_count") or 0)

          if total <= 0:
              raise SystemExit("資料完整性檢查失敗：標案總數為 0，拒絕發布")
          if org_count and len(failed) / org_count >= 0.5:
              raise SystemExit(
                  f"資料完整性檢查失敗：{len(failed)}/{org_count} 個機關失敗，拒絕發布"
              )
          print(f"資料完整性檢查通過：{total} 筆，失敗機關 {len(failed)} 個")
          PY

      - name: 產生 index.html
        run: python build_index.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --staged --quiet || git commit -m "update: $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M') (Taipei)"
          git pull --rebase origin main
          git push
